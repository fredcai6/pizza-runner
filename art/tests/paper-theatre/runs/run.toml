models = ["klein", "qwen-edit"]
seeds = [1, 2]
width = 1024
height = 1024
comfy_args = ["--reserve-vram", "1.5"]
template = "{action}"

[shots.slice_A]
width = 1024
height = 1024
refs = ["tests/paper-theatre/refs/slice_master.png"]
prompt = "Full body character art for a 2D platformer, the whole figure visible head to sneakers, standing and facing slightly right. The character is the New York pizza slice mascot from image 1: a triangular slice with thin crust along the top, melted cheese, three pepperoni, a face on the cheese, thin arms and legs, white gloves, red sneakers. Flat papercraft cutout look: simple bold shapes, clean flat colour with one soft shade, a thin white paper border around the whole silhouette. The face keeps a normal friendly expression with simple dot eyes and a smile. Gentle soft shading with a little highlight and a soft shade under each fold, still clean and flat. The background is one perfectly flat, uniformly lit magenta fill: no spotlight, no gradient, no cast shadow, no floor shadow and no shadow shapes on the background. Absolutely no text, letters, numbers, logos, labels, signs or lettering anywhere in the image. Exactly two arms and two legs, no extra limbs or hands."

