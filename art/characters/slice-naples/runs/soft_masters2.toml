models = ["qwen-edit"]
seeds = [1, 2, 3]
width = 1024
height = 1024
comfy_args = ["--reserve-vram", "1.5"]
template = "{action}"

[shots.s_d]
refs = ["characters/slice-naples/references/paper-master.png", "paper/style_pm_sq.png"]
prompt = "Image 1 is La Contessa, a finished paper standee pizza slice mascot. Redraw La Contessa, the Neapolitan margherita pizza slice, with a very puffy, plump, blistered cornicione crust with dark leopard spots, red tomato sauce, white mozzarella, three round tomato slices and three green basil leaves, soft thin arms with white gloves, brown sneakers. Smooth clean vector shapes, not pixel art. The silhouette must NOT be a sharp straight-edged triangle: draw it as a soft rounded blob-like wedge, like a squishy plush toy, with both long sides bulging outward in curves, every corner fully rounded, and the bottom tip rounded like a fingertip. The body tilts and bends sideways a little. Limbs are thick soft rounded tubes. It must still read instantly as a pizza slice. Keep exactly image 1's material, thick white paper cut border, clean flat colours with one soft shade, and above all its face: two small plain blank black dot eyes, no eyebrows, no white eyeballs, no pupils, a small flat line mouth tilted into a proud knowing smirk. Standing and facing slightly right, the whole figure visible head to feet. Image 2 shows only the paper material to borrow; do not copy its characters. The background is one perfectly flat, uniformly lit magenta fill: no spotlight, no gradient, no cast shadow, no floor shadow and no shadow shapes on the background. Absolutely no text, letters, numbers, logos, labels, signs or lettering anywhere in the image. Exactly two arms and two legs, no extra limbs or hands."

[shots.s_e]
refs = ["characters/slice-naples/references/paper-master.png", "paper/style_pm_sq.png"]
prompt = "Image 1 is La Contessa, a finished paper standee pizza slice mascot. Redraw La Contessa, the Neapolitan margherita slice, as a soft limp slice: a big pillowy leopard-spotted puffy crust, red sauce, white mozzarella, three round tomato slices and three green basil leaves, thin soft arms with white gloves, brown sneakers. Smooth clean vector shapes, not pixel art. The slice is made of soft bendable dough: the body curves in a gentle banana bend, the long sides are wavy and bulging, the crust end sags and the lower tip droops over to one side, all corners are rounded off, nothing is straight or rigid. Arms and legs are soft curvy noodles. It must still read instantly as a pizza slice. Keep exactly image 1's material, thick white paper cut border, clean flat colours with one soft shade, and above all its face: two small plain blank black dot eyes, no eyebrows, no white eyeballs, no pupils, a small flat line mouth tilted into a proud knowing smirk. Standing and facing slightly right, the whole figure visible head to feet. Image 2 shows only the paper material to borrow; do not copy its characters. The background is one perfectly flat, uniformly lit magenta fill: no spotlight, no gradient, no cast shadow, no floor shadow and no shadow shapes on the background. Absolutely no text, letters, numbers, logos, labels, signs or lettering anywhere in the image. Exactly two arms and two legs, no extra limbs or hands."
