models = ["qwen-edit"]
seeds = [1, 2, 3]
width = 1024
height = 1024
comfy_args = ["--reserve-vram", "1.5"]
template = "{action}"

[shots.s_a]
refs = ["characters/slice-naples/references/paper-master.png", "paper/style_pm_sq.png"]
prompt = "Image 1 is La Contessa, a finished paper standee pizza slice mascot. Redraw La Contessa, the small quick Neapolitan margherita pizza slice, softer. Keep her puffy charred crust with dark leopard spots, but make it rounder and plumper, and make the whole slice a soft rounded wedge with a gently bulging, curved outline and a rounded tip. Red tomato sauce, white mozzarella, three round slices of red tomato and three green basil leaves, thin soft arms with white gloves, brown sneakers. Smooth clean vector shapes, not pixel art. Soften the shapes: round every corner, give every edge a soft bulge and curve, bend the whole body gently, and use soft, rounder, curvier limbs. No rigid flat triangle, no straight stiff edges. Keep exactly image 1's material, thick white paper cut border, clean flat colours with one soft shade, and above all its face: two small plain blank black dot eyes, no eyebrows, no white eyeballs, no pupils, a small flat line mouth tilted into a proud knowing smirk. Standing and facing slightly right, the whole figure visible head to feet. Image 2 shows only the paper material to borrow; do not copy its characters. The background is one perfectly flat, uniformly lit magenta fill: no spotlight, no gradient, no cast shadow, no floor shadow and no shadow shapes on the background. Absolutely no text, letters, numbers, logos, labels, signs or lettering anywhere in the image. Exactly two arms and two legs, no extra limbs or hands."

[shots.s_b]
refs = ["characters/slice-naples/references/paper-master.png", "paper/style_pm_sq.png"]
prompt = "Image 1 is La Contessa, a finished paper standee pizza slice mascot. Redraw La Contessa, the Neapolitan margherita slice, as a soft, bendy, droopy slice: a big puffy leopard-spotted cornicione crust, a soft sagging body with bulging curved sides and a rounded drooping tip, red sauce, white mozzarella, three round tomato slices and three green basil leaves, noodle-soft arms with white gloves, brown sneakers. Smooth clean vector shapes, not pixel art. Make the whole body soft and pillowy like a squishy cloth toy: very rounded corners, plump bulging edges, a gentle S-curve bend in the body, noodle-soft arms and legs, and a rounded tip instead of a sharp point. It must still read instantly as a pizza slice. Keep exactly image 1's material, thick white paper cut border, clean flat colours with one soft shade, and above all its face: two small plain blank black dot eyes, no eyebrows, no white eyeballs, no pupils, a small flat line mouth tilted into a proud knowing smirk. Standing and facing slightly right, the whole figure visible head to feet. Image 2 shows only the paper material to borrow; do not copy its characters. The background is one perfectly flat, uniformly lit magenta fill: no spotlight, no gradient, no cast shadow, no floor shadow and no shadow shapes on the background. Absolutely no text, letters, numbers, logos, labels, signs or lettering anywhere in the image. Exactly two arms and two legs, no extra limbs or hands."

[shots.s_c]
refs = ["characters/slice-naples/references/paper-master.png", "paper/style_pm_sq.png"]
prompt = "Image 1 is La Contessa, a finished paper standee pizza slice mascot. Redraw La Contessa, the Neapolitan margherita pizza slice, as a plump rounded little slice with a pillowy puffy blistered crust with dark leopard spots, soft curved edges, a gentle bend in the body and a rounded tip, red sauce, white mozzarella, three round tomato slices, three green basil leaves, soft rounded arms with white gloves, brown sneakers. Smooth clean vector shapes, not pixel art. Make the slice limp and drooping: it sags and bows under its own weight, the edges wave in soft curves, the corners are rounded, the tip hangs a little to one side, and the arms and legs are soft and rounded. It must still read instantly as a pizza slice, never a rigid flat triangle. Keep exactly image 1's material, thick white paper cut border, clean flat colours with one soft shade, and above all its face: two small plain blank black dot eyes, no eyebrows, no white eyeballs, no pupils, a small flat line mouth tilted into a proud knowing smirk. Standing and facing slightly right, the whole figure visible head to feet. Image 2 shows only the paper material to borrow; do not copy its characters. The background is one perfectly flat, uniformly lit magenta fill: no spotlight, no gradient, no cast shadow, no floor shadow and no shadow shapes on the background. Absolutely no text, letters, numbers, logos, labels, signs or lettering anywhere in the image. Exactly two arms and two legs, no extra limbs or hands."
