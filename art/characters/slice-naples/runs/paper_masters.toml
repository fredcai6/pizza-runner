[shots.m_A]
refs = ["characters/slice-naples/references/master.png", "paper/style_pm_sq.png"]
prompt = "Full body character art for a 2D platformer, standing and facing slightly right, the whole figure visible head to sneakers. The character is La Contessa, the small, quick Neapolitan pizza slice mascot from image 1: a neat small triangle with a puffy charred thin crust with dark leopard spots along the top, red tomato sauce, white mozzarella, three round slices of red tomato and three green basil leaves as toppings, thin arms with white gloves, brown sneakers. Paper Mario style papercraft cutout, a standee cut from card: simple bold shapes, clean flat colours with one soft shade, a clear white paper cut border about as thick as a finger around the entire silhouette, a faint paper grain texture. The face is a Charlie the Unicorn style flat deadpan face: two small plain blank black dot eyes, no eyebrows, a small flat line mouth tilted into a proud knowing smirk, almost no detail. Completely flat fills with no shading at all. Images after the first show only the drawing style to borrow (material, border, face flatness); do not copy their characters or animals. The background is one perfectly flat, uniformly lit magenta fill: no spotlight, no gradient, no cast shadow, no floor shadow and no shadow shapes on the background. Absolutely no text, letters, numbers, logos, labels, signs or lettering anywhere in the image. Exactly two arms and two legs, no extra limbs or hands."

