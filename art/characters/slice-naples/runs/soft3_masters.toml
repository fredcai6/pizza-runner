models = ["qwen-edit"]
seeds = [1, 2, 3]
width = 1024
height = 1024
comfy_args = ["--reserve-vram", "1.5"]
template = "{action}"

[shots.g_1]
refs = ["tests/soft-pizzas/guides/slice-naples-g1.png", "characters/slice-ny/references/paper-master.png", "paper/style_pm_sq.png"]
prompt = "Image 1 is a flat-colour silhouette guide for a pizza slice mascot. Repaint it as a paper standee in the exact style of image 2: its thick white paper cut border, clean flat colours with one soft shade, and above all its face: two small plain blank black dot eyes, no eyebrows, no white eyeballs, no pupils, a small flat line mouth tilted into a proud knowing smirk. KEEP image 1's exact silhouette, proportions and pose: every soft rounded curve, bulge, bend and droop must stay as drawn, never straightened into a rigid triangle. The character is La Contessa, a small Neapolitan margherita slice: a rounded wedge with a puffy bubbly blistered crust rim with dark leopard spots, red tomato sauce, white mozzarella blobs, three round tomato slices, green basil leaves, thin arms with white gloves, brown sneakers. Smooth clean vector shapes, not pixel art. Standing, the whole figure visible head to feet. Image 2 shows only the paper material and the face to borrow; do not copy its character's shape or its crust. Image 3 shows only the paper material. The background is one perfectly flat, uniformly lit magenta fill: no spotlight, no gradient, no cast shadow, no floor shadow and no shadow shapes on the background. Absolutely no text, letters, numbers, logos, labels, signs or lettering anywhere in the image. Exactly two arms and two legs, no extra limbs or hands."

