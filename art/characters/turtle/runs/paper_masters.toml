[shots.t_A]
refs = ["characters/turtle/references/master.png", "paper/style_pm_sq.png"]
prompt = "Full body character art for a 2D platformer, the whole figure visible, a side view facing right. The character is the old grumpy turtle from image 1: a big domed green-brown shell with lighter patches, a plaid scarf around the neck, olive green skin, standing on four stubby legs. Paper Mario style papercraft standee: the whole character is a flat cut-out of printed card, a thick white paper border all around the silhouette like a sticker, a visible fold crease line across the body, a slightly curled corner, a visible paper fibre texture and soft matte printing, simple bold shapes, flat colours. The face is simple: two small plain black dot eyes, no glasses, no eyebrows, a flat line mouth, almost no detail. Gentle soft shading with a little highlight and a soft shade under each fold, still clean and flat. Images after the first show only the drawing style to borrow (material, border, face flatness); do not copy their characters or animals. The background is one perfectly flat, uniformly lit magenta fill: no spotlight, no gradient, no cast shadow, no floor shadow and no shadow shapes on the background. Absolutely no text, letters, numbers, logos, labels, signs or lettering anywhere in the image. Four legs, one head."
