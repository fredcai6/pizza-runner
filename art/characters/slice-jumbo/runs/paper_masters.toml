template = "{action}"

[shots.m_A]
refs = ["characters/slice-jumbo/references/master.png", "paper/style_pm_sq.png"]
prompt = "Full body character art for a 2D platformer, standing and facing slightly right, the whole figure visible head to sneakers. The character is Phil A. Buster, the absurdly big floppy pizza slice mascot from image 1: a huge long drooping triangle of a slice, the crust a big rolled tube along the top, the pointed tip flopping and bending over to one side, thick melted yellow cheese dripping down, three round pepperoni, small thin arms with white gloves, tiny thin legs and red sneakers that look far too small for the huge body. Paper Mario style papercraft cutout, a standee cut from card: simple bold shapes, clean flat colours with one soft shade, a clear white paper cut border about as thick as a finger around the entire silhouette, a faint paper grain texture. The face is a Charlie the Unicorn style flat deadpan face: two small plain blank black dot eyes, no eyebrows, a small wobbly wavy line mouth, pompous and anxious, almost no detail. Completely flat fills with no shading at all. Images after the first show only the drawing style to borrow (material, border, face flatness); do not copy their characters or animals. The background is one perfectly flat, uniformly lit magenta fill: no spotlight, no gradient, no cast shadow, no floor shadow and no shadow shapes on the background. Absolutely no text, letters, numbers, logos, labels, signs or lettering anywhere in the image. Exactly two arms and two legs, no extra limbs or hands."

