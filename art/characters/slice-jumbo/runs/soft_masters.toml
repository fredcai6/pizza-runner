models = ["qwen-edit"]
seeds = [1, 2, 3]
width = 1024
height = 1024
comfy_args = ["--reserve-vram", "1.5"]
template = "{action}"

[shots.s_a]
refs = ["characters/slice-jumbo/references/paper-master.png", "paper/style_pm_sq.png"]
prompt = "Image 1 is Phil A. Buster, a finished paper standee pizza slice mascot. Redraw Phil A. Buster, a huge jumbo New York style slice, softer and floppier. The crust edge is a thin, plain, flat crust, NOT rolled and NOT stuffed and not a tube. The slice is huge and thin, and the tip sags and droops over to one side under its own size, the way a jumbo slice folds when you hold it. Melted yellow cheese, three round pepperoni, small thin soft arms with white gloves, tiny thin legs and small red sneakers that look far too small for the huge slice. Soften the shapes: round every corner, give every edge a soft bulge and curve, bend the whole body gently, and use soft, rounder, curvier limbs. No rigid flat triangle, no straight stiff edges. Keep exactly image 1's material, thick white paper cut border, clean flat colours with one soft shade, and above all its face: two small plain blank black dot eyes, no eyebrows, no white eyeballs, no pupils, a small wobbly wavy line mouth, pompous and anxious. Standing and facing slightly right, the whole figure visible head to feet. Image 2 shows only the paper material to borrow; do not copy its characters. The background is one perfectly flat, uniformly lit magenta fill: no spotlight, no gradient, no cast shadow, no floor shadow and no shadow shapes on the background. Absolutely no text, letters, numbers, logos, labels, signs or lettering anywhere in the image. Exactly two arms and two legs, no extra limbs or hands."

[shots.s_b]
refs = ["characters/slice-jumbo/references/paper-master.png", "paper/style_pm_sq.png"]
prompt = "Image 1 is Phil A. Buster, a finished paper standee pizza slice mascot. Redraw Phil A. Buster, an enormous thin floppy jumbo pizza slice. A thin, plain, slightly wavy crust edge, no roll and no tube and no stuffed crust. The long slice folds and bends in the middle and the whole tip flops down in a big droop, like a real jumbo slice held by the crust. Melted yellow cheese, three round pepperoni, thin soft noodle arms with white gloves, tiny thin legs and small red sneakers far too small for the huge body. Make the whole body soft and pillowy like a squishy cloth toy: very rounded corners, plump bulging edges, a gentle S-curve bend in the body, noodle-soft arms and legs, and a rounded tip instead of a sharp point. It must still read instantly as a pizza slice. Keep exactly image 1's material, thick white paper cut border, clean flat colours with one soft shade, and above all its face: two small plain blank black dot eyes, no eyebrows, no white eyeballs, no pupils, a small wobbly wavy line mouth, pompous and anxious. Standing and facing slightly right, the whole figure visible head to feet. Image 2 shows only the paper material to borrow; do not copy its characters. The background is one perfectly flat, uniformly lit magenta fill: no spotlight, no gradient, no cast shadow, no floor shadow and no shadow shapes on the background. Absolutely no text, letters, numbers, logos, labels, signs or lettering anywhere in the image. Exactly two arms and two legs, no extra limbs or hands."

[shots.s_c]
refs = ["characters/slice-jumbo/references/paper-master.png", "paper/style_pm_sq.png"]
prompt = "Image 1 is Phil A. Buster, a finished paper standee pizza slice mascot. Redraw Phil A. Buster, a gigantic wilting jumbo pizza slice: wide, thin and limp, the thin plain crust edge sags in a soft curve and the pointed tip hangs down and flops over to the side. Plain thin crust, not rolled, not stuffed. Melted yellow cheese, three round pepperoni, small thin soft arms with white gloves, tiny legs and small red sneakers. Make the slice limp and drooping: it sags and bows under its own weight, the edges wave in soft curves, the corners are rounded, the tip hangs a little to one side, and the arms and legs are soft and rounded. It must still read instantly as a pizza slice, never a rigid flat triangle. Keep exactly image 1's material, thick white paper cut border, clean flat colours with one soft shade, and above all its face: two small plain blank black dot eyes, no eyebrows, no white eyeballs, no pupils, a small wobbly wavy line mouth, pompous and anxious. Standing and facing slightly right, the whole figure visible head to feet. Image 2 shows only the paper material to borrow; do not copy its characters. The background is one perfectly flat, uniformly lit magenta fill: no spotlight, no gradient, no cast shadow, no floor shadow and no shadow shapes on the background. Absolutely no text, letters, numbers, logos, labels, signs or lettering anywhere in the image. Exactly two arms and two legs, no extra limbs or hands."
