models = ["qwen-edit"]
seeds = [1, 2, 3]
width = 1024
height = 1024
comfy_args = ["--reserve-vram", "1.5"]
template = "{action}"

[shots.m_A]
refs = ["characters/slice-ny/references/paper-master.png", "paper/style_pm_sq.png"]
prompt = "Image 1 is Vinny, a finished paper standee pizza slice mascot. Redraw it as a different character: Phil A. Buster, an absurdly big, floppy pizza slice: keep image 1's body plan but make the slice far longer and larger than the legs, with a big rolled tube of crust along the top, the long pointed tip drooping and bending over to one side, thick melted yellow cheese dripping down the sides, three round pepperoni, thin small arms and white gloves, tiny thin legs and small red sneakers that look far too small for the huge slice. Keep exactly image 1's material, thick white paper cut border, clean flat colours, simple bold shapes, and above all its face: two small plain blank black dot eyes, no eyebrows, no white eyeballs, no pupils, a small wobbly wavy line mouth, pompous and anxious. Standing and facing slightly right, the whole figure visible head to feet. Image 2 shows only the paper material to borrow; do not copy its characters. The background is one perfectly flat, uniformly lit magenta fill: no spotlight, no gradient, no cast shadow, no floor shadow and no shadow shapes on the background. Absolutely no text, letters, numbers, logos, labels, signs or lettering anywhere in the image. Exactly two arms and two legs, no extra limbs or hands."

[shots.m_B]
refs = ["characters/slice-ny/references/paper-master.png", "paper/style_pm_sq.png"]
prompt = "Image 1 is Vinny, a finished paper standee pizza slice mascot. Redraw it as a different character: Phil A. Buster, an absurdly big, floppy pizza slice: keep image 1's body plan but make the slice far longer and larger than the legs, with a big rolled tube of crust along the top, the long pointed tip drooping and bending over to one side, thick melted yellow cheese dripping down the sides, three round pepperoni, thin small arms and white gloves, tiny thin legs and small red sneakers that look far too small for the huge slice. Keep exactly image 1's material, thick white paper cut border, clean flat colours with one soft shade, simple bold shapes, and above all its face: two small plain blank black dot eyes, no eyebrows, no white eyeballs, no pupils, a small wobbly wavy line mouth, pompous and anxious. Standing and facing slightly right, the whole figure visible head to feet. Image 2 shows only the paper material to borrow; do not copy its characters. The background is one perfectly flat, uniformly lit magenta fill: no spotlight, no gradient, no cast shadow, no floor shadow and no shadow shapes on the background. Absolutely no text, letters, numbers, logos, labels, signs or lettering anywhere in the image. Exactly two arms and two legs, no extra limbs or hands."
