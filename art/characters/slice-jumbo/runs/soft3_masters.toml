models = ["qwen-edit"]
seeds = [1, 2, 3]
width = 1024
height = 1024
comfy_args = ["--reserve-vram", "1.5"]
template = "{action}"

[shots.g_1]
refs = ["tests/soft-pizzas/guides/slice-jumbo-g1.png", "characters/slice-ny/references/paper-master.png", "paper/style_pm_sq.png"]
prompt = "Image 1 is a flat-colour silhouette guide for a pizza slice mascot. Repaint it as a paper standee in the exact style of image 2: its thick white paper cut border, clean flat colours with one soft shade, and above all its face: two small plain blank black dot eyes, no eyebrows, no white eyeballs, no pupils, a small wobbly wavy line mouth, pompous and anxious. KEEP image 1's exact silhouette, proportions and pose: every soft rounded curve, bulge, bend and droop must stay as drawn, never straightened into a rigid triangle. The character is Phil A. Buster, a gigantic floppy New York jumbo slice: very long, wide and thin, with a plain thin flat crust edge (not a rolled tube, not stuffed), the front of the slice folding down and the tip drooping and curling under its own weight, melted yellow cheese, three round pepperoni, thin arms with white gloves, tiny legs and small red sneakers. Standing, the whole figure visible head to feet. Image 2 shows only the paper material and the face to borrow; do not copy its character's shape or its crust. Image 3 shows only the paper material. The background is one perfectly flat, uniformly lit magenta fill: no spotlight, no gradient, no cast shadow, no floor shadow and no shadow shapes on the background. Absolutely no text, letters, numbers, logos, labels, signs or lettering anywhere in the image. Exactly two arms and two legs, no extra limbs or hands."

