models = ["qwen-edit"]
seeds = [1, 2, 3]
width = 1024
height = 1024
comfy_args = ["--reserve-vram", "1.5"]
template = "{action}"

[shots.s_d]
refs = ["characters/slice-jumbo/references/paper-master.png", "paper/style_pm_sq.png"]
prompt = "Image 1 is Phil A. Buster, a finished paper standee pizza slice mascot. Redraw Phil A. Buster, a gigantic jumbo pizza slice with a thin plain crust edge: the crust is just a thin flat strip with a slightly wavy edge, absolutely NOT a rolled tube, NOT puffy, NOT stuffed. The huge thin slice is folded: the top part stands up, then the whole lower half folds over and flops down to one side in a big droop, like a real jumbo slice folding in a hand. Melted yellow cheese, three round pepperoni, thin soft arms with white gloves, tiny thin legs and small red sneakers far too small for the body. The silhouette must NOT be a sharp straight-edged triangle: draw it as a soft rounded blob-like wedge, like a squishy plush toy, with both long sides bulging outward in curves, every corner fully rounded, and the bottom tip rounded like a fingertip. The body tilts and bends sideways a little. Limbs are thick soft rounded tubes. It must still read instantly as a pizza slice. Keep exactly image 1's material, thick white paper cut border, clean flat colours with one soft shade, and above all its face: two small plain blank black dot eyes, no eyebrows, no white eyeballs, no pupils, a small wobbly wavy line mouth, pompous and anxious. Standing and facing slightly right, the whole figure visible head to feet. Image 2 shows only the paper material to borrow; do not copy its characters. The background is one perfectly flat, uniformly lit magenta fill: no spotlight, no gradient, no cast shadow, no floor shadow and no shadow shapes on the background. Absolutely no text, letters, numbers, logos, labels, signs or lettering anywhere in the image. Exactly two arms and two legs, no extra limbs or hands."

[shots.s_e]
refs = ["characters/slice-jumbo/references/paper-master.png", "paper/style_pm_sq.png"]
prompt = "Image 1 is Phil A. Buster, a finished paper standee pizza slice mascot. Redraw Phil A. Buster, a gigantic floppy jumbo pizza slice, thin as paper: a very thin flat plain crust strip along the top, no roll, no tube, no puffiness. The slice is so big and thin that it sags under its own weight and the pointed end curls and hangs down limply. Melted yellow cheese, three round pepperoni, thin soft arms with white gloves, tiny thin legs and small red sneakers far too small for the body. The slice is made of soft bendable dough: the body curves in a gentle banana bend, the long sides are wavy and bulging, the crust end sags and the lower tip droops over to one side, all corners are rounded off, nothing is straight or rigid. Arms and legs are soft curvy noodles. It must still read instantly as a pizza slice. Keep exactly image 1's material, thick white paper cut border, clean flat colours with one soft shade, and above all its face: two small plain blank black dot eyes, no eyebrows, no white eyeballs, no pupils, a small wobbly wavy line mouth, pompous and anxious. Standing and facing slightly right, the whole figure visible head to feet. Image 2 shows only the paper material to borrow; do not copy its characters. The background is one perfectly flat, uniformly lit magenta fill: no spotlight, no gradient, no cast shadow, no floor shadow and no shadow shapes on the background. Absolutely no text, letters, numbers, logos, labels, signs or lettering anywhere in the image. Exactly two arms and two legs, no extra limbs or hands."
