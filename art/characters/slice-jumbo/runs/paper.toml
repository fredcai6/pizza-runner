models = ["qwen-edit"]
seeds = [1, 2, 3]
width = 1024
height = 1024
comfy_args = ["--reserve-vram", "1.5"]
template = "Redraw the character from image 1 exactly as it is: the same paper standee, the same thick white paper border all around the silhouette like a sticker, the same flat colours, the same face style. Exactly two arms and two legs, two hands. {action} The whole figure is visible in frame with the white border complete. Image 2 shows only the paper material to borrow; do not copy its characters. The background is one perfectly flat, uniformly lit magenta fill: no spotlight, no gradient, no cast shadow, no floor shadow and no shadow shapes on the background. Absolutely no text, letters, numbers, logos, labels, signs or lettering anywhere in the image. Exactly two arms and two legs, no extra limbs or hands."
refs = ["characters/slice-jumbo/references/paper-master.png", "paper/style_pm_sq.png"]

[shots.idle_b]
prompt = "Idle: standing, drawing a breath, slightly taller, one thin arm raised in a pompous gesture as if giving a speech, the tip of the slice flopping."

[shots.idle_c]
prompt = "Idle: standing, exhaling, slightly lower, the floppy tip drooping further, head tilted, both thin arms hanging."

[shots.jump_rise]
prompt = "Jumping upward: tiny legs stretched down and apart, both thin arms thrown up, the floppy tip trailing below, mouth a small flat open line."

[shots.fall]
prompt = "Floating down through the air like a wet napkin: the slice tilted, tiny legs dangling, thin arms flung out wide, the floppy tip fluttering up."

[shots.cold_a]
prompt = "Cold and stale: the whole body pale grey-blue and stiff, dull toppings, hugging itself shivering, hunched. The face stays deadpan with the same dot eyes and a flat wobbly line mouth."

[shots.cold_b]
prompt = "Cold and stale: pale grey-blue stiff body, hunched over shivering. The face stays deadpan with the same dot eyes and a flat wobbly line mouth."

[shots.special_a]
prompt = "Belly flop leap: flung forward through the air and tilted almost flat, tiny thin arms and legs spread wide, mouth a flat open line."

[shots.special_b]
prompt = "Belly flop landing: lying flat face-down on the ground splatted wide like a pancake, thin arms and legs spread out to the sides, a spreading puddle of melted yellow cheese around the body. The face stays deadpan."
