models = ["qwen-edit"]
seeds = [1, 2, 3]
width = 1024
height = 1024
comfy_args = ["--reserve-vram", "1.5"]
template = "{action}"

[shots.ot_A]
refs = ["characters/old-timer/references/old_seed1.png", "paper/style_pm_sq.png"]
prompt = "Full body character art for a 2D platformer, the whole figure visible head to boots, standing hunched and facing the viewer. The character is the ancient stale old pizza slice sergeant from image 1: a weathered triangular slice with dull cracked matte cheese, only two shrivelled pepperoni, a thin crust along the top, thin arms and legs, grey gloves, worn brown boots, wearing an old-school police hat (a dark navy peaked cap with a flat brim and a small plain gold badge with no lettering) and a big bushy grey-white angry mustache that droops down at both sides above a flat line mouth. Paper Mario style papercraft standee: the whole character is a flat cut-out of printed card, a thick white paper border all around the silhouette like a sticker, a visible fold crease line across the body, a slightly curled corner, a visible paper fibre texture and soft matte printing, simple bold shapes, flat colours. The face is a Charlie the Unicorn style flat deadpan face: two small plain black dot eyes, no eyebrows, a flat line mouth hidden under the mustache, almost no detail. Gentle soft shading with a little highlight and a soft shade under each fold, still clean and flat. Images after the first show only the drawing style to borrow (material, border, face flatness); do not copy their characters or animals. The background is one perfectly flat, uniformly lit magenta fill: no spotlight, no gradient, no cast shadow, no floor shadow and no shadow shapes on the background. Absolutely no text, letters, numbers, logos, labels, signs or lettering anywhere in the image. Exactly two arms and two legs, no extra limbs or hands."

[shots.ot_B]
refs = ["characters/old-timer/references/old_seed1.png", "characters/slice-ny/references/paper-master.png"]
prompt = "Full body character art for a 2D platformer, the whole figure visible head to boots, standing hunched and facing the viewer. The character is the ancient stale old pizza slice sergeant from image 1: a weathered triangular slice with dull cracked matte cheese, only two shrivelled pepperoni, a thin crust along the top, thin arms and legs, grey gloves, worn brown boots, wearing an old-school police hat (a dark navy peaked cap with a flat brim and a small plain gold badge with no lettering) and a big bushy grey-white angry mustache that droops down at both sides above a flat line mouth. Image 2 is a different character, the hero Vinny: draw the sergeant in exactly the same material, paper border, shading and face formula as image 2 (two small blank black dot eyes, no eyebrows), but keep the sergeant's own body, hat and mustache. The background is one perfectly flat, uniformly lit magenta fill: no spotlight, no gradient, no cast shadow, no floor shadow and no shadow shapes on the background. Absolutely no text, letters, numbers, logos, labels, signs or lettering anywhere in the image. Exactly two arms and two legs, no extra limbs or hands."
