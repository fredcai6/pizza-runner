# Written by art/paper/make_sheet_runs.py
models = ["qwen-edit"]
seeds = [1, 2, 3]
width = 1024
height = 1024
comfy_args = ["--reserve-vram", "1.5"]
template = "{action}"

[shots.talk_open]
refs = ["characters/old-timer/references/paper-master.png", "characters/old-timer/references/sheet.png"]
prompt = "Image 1 is a cartoon pizza mascot cut out as a paper sticker. Redraw the same character: the same shapes, colours, bold dark outline, thick white sticker border all around the silhouette, the same face style, white cartoon gloves and red sneakers. Talking: the mouth open mid-sentence under the big mustache, one gloved hand raised with a finger pointing up as if lecturing, the other fist on the hip, the same stern brows and police hat. The whole figure is visible in frame with the white border complete. Image 2 is this character's model sheet: match its drawing style; do not copy its layout, labels or other poses. The background is one perfectly flat, uniformly lit magenta fill: no spotlight, no gradient, no cast shadow, no floor shadow and no shadow shapes on the background. Absolutely no text, letters, numbers, logos, labels, signs or lettering anywhere in the image. Exactly two arms and two legs, no extra limbs or hands."

[shots.squint]
refs = ["characters/old-timer/references/paper-master.png", "characters/old-timer/references/sheet.png"]
prompt = "Image 1 is a cartoon pizza mascot cut out as a paper sticker. Redraw the same character: the same shapes, colours, bold dark outline, thick white sticker border all around the silhouette, the same face style, white cartoon gloves and red sneakers. Squinting suspiciously: both eyes narrowed into thin flat slits under the stern brows, one gloved hand stroking the mustache, leaning toward the viewer, the same police hat. The whole figure is visible in frame with the white border complete. Image 2 is this character's model sheet: match its drawing style; do not copy its layout, labels or other poses. The background is one perfectly flat, uniformly lit magenta fill: no spotlight, no gradient, no cast shadow, no floor shadow and no shadow shapes on the background. Absolutely no text, letters, numbers, logos, labels, signs or lettering anywhere in the image. Exactly two arms and two legs, no extra limbs or hands."
