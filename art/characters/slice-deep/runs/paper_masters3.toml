template = "{action}"

[shots.m_A]
refs = ["characters/slice-ny/references/paper-master.png", "paper/style_pm_sq.png"]
prompt = "Image 1 is Vinny, a finished paper standee pizza slice mascot. Redraw it as a different character: Big Stan, a heavy Chicago deep dish pizza slice: keep image 1's body plan but make the slice a tall, thick, heavy wedge with a thick golden-brown crust wall along the top and sides, the top brimming with thick glossy red tomato sauce over the cheese, long red sauce drips running down the sides with a fat drop at the bottom, three round pepperoni, burly thick arms, white gloves, and heavy black boots instead of sneakers. Stocky and wide. Keep exactly image 1's material, thick white paper cut border, clean flat colours, simple bold shapes, and above all its face: two small plain blank black dot eyes, no eyebrows, no white eyeballs, no pupils, a flat heavy downturned line mouth, grumpy and stubborn. Standing and facing slightly right, the whole figure visible head to feet. Image 2 shows only the paper material to borrow; do not copy its characters. The background is one perfectly flat, uniformly lit magenta fill: no spotlight, no gradient, no cast shadow, no floor shadow and no shadow shapes on the background. Absolutely no text, letters, numbers, logos, labels, signs or lettering anywhere in the image. Exactly two arms and two legs, no extra limbs or hands."

