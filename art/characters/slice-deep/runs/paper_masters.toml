prompt = "Full body character art for a 2D platformer, standing and facing slightly right, the whole figure visible head to boots. The character is Big Stan, the Chicago deep dish pizza slice mascot from image 1: a tall, thick, heavy wedge with a thick golden-brown crust wall around the sides, the top brimming with thick glossy red tomato sauce over melted cheese, red sauce running down the sides in long drips with a fat drop at the bottom, three round pepperoni, burly thick arms with white gloves, heavy black boots. Paper Mario style papercraft cutout, a standee cut from card: simple bold shapes, clean flat colours with one soft shade, a clear white paper cut border about as thick as a finger around the entire silhouette, a faint paper grain texture. The face is a Charlie the Unicorn style flat deadpan face: two small plain blank black dot eyes, no eyebrows, a flat heavy downturned line mouth, grumpy and stubborn, almost no detail. Completely flat fills with no shading at all. Images after the first show only the drawing style to borrow (material, border, face flatness); do not copy their characters or animals. The background is one perfectly flat, uniformly lit magenta fill: no spotlight, no gradient, no cast shadow, no floor shadow and no shadow shapes on the background. Absolutely no text, letters, numbers, logos, labels, signs or lettering anywhere in the image. Exactly two arms and two legs, no extra limbs or hands."

