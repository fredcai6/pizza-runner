models = ["qwen-edit"]
seeds = [1, 2, 3]
width = 1024
height = 1024
comfy_args = ["--reserve-vram", "1.5"]
template = "{action}"

[shots.m_A]
refs = ["characters/slice-ny/references/paper-master.png", "characters/slice-deep/references/current.png", "paper/style_pm_sq.png"]
prompt = "Image 1 is Vinny, a finished paper standee pizza slice. Image 2 is a different pizza slice character in pixel-art. Redraw the character of image 2 as a new paper standee that matches image 1 exactly in material, thick white paper cut border, clean flat vector shapes, matching flat colours, and above all in FACE: two small plain blank black dot eyes, no eyebrows, a flat heavy downturned line mouth, grumpy and stubborn, almost no detail. No eyebrows at all, no white eyeballs, no pupils, no lashes, no pixel art. Keep the identity of image 2: Big Stan, the Chicago deep dish pizza slice mascot from image 2: a tall, thick, heavy wedge with a thick golden-brown crust wall around the sides, the top brimming with thick glossy red tomato sauce over melted cheese, red sauce running down the sides in long drips with a fat drop at the bottom, three round pepperoni, burly thick arms with white gloves, heavy black boots. Pose: standing and facing slightly right, the whole figure visible head to boots. Image 3 shows only the paper material to borrow; do not copy its characters. The background is one perfectly flat, uniformly lit magenta fill: no spotlight, no gradient, no cast shadow, no floor shadow and no shadow shapes on the background. Absolutely no text, letters, numbers, logos, labels, signs or lettering anywhere in the image. Exactly two arms and two legs, no extra limbs or hands."

[shots.m_B]
refs = ["characters/slice-ny/references/paper-master.png", "characters/slice-deep/references/current.png", "paper/style_pm_sq.png"]
prompt = "Image 1 is Vinny, a finished paper standee pizza slice. Image 2 is a different pizza slice character in pixel-art. Redraw the character of image 2 as a new paper standee that matches image 1 exactly in material, thick white paper cut border, clean flat vector shapes, matching flat colours with one soft shade, and above all in FACE: two small plain blank black dot eyes, no eyebrows, a flat heavy downturned line mouth, grumpy and stubborn, almost no detail. No eyebrows at all, no white eyeballs, no pupils, no lashes, no pixel art. Keep the identity of image 2: Big Stan, the Chicago deep dish pizza slice mascot from image 2: a tall, thick, heavy wedge with a thick golden-brown crust wall around the sides, the top brimming with thick glossy red tomato sauce over melted cheese, red sauce running down the sides in long drips with a fat drop at the bottom, three round pepperoni, burly thick arms with white gloves, heavy black boots. Pose: standing and facing slightly right, the whole figure visible head to boots. Image 3 shows only the paper material to borrow; do not copy its characters. The background is one perfectly flat, uniformly lit magenta fill: no spotlight, no gradient, no cast shadow, no floor shadow and no shadow shapes on the background. Absolutely no text, letters, numbers, logos, labels, signs or lettering anywhere in the image. Exactly two arms and two legs, no extra limbs or hands."
