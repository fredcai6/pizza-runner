models = ["qwen-edit"]
seeds = [1, 2, 3]
width = 1024
height = 1024
comfy_args = ["--reserve-vram", "1.5"]
template = "{action}"

[shots.s_d]
refs = ["characters/slice-deep/references/paper-master.png", "paper/style_pm_sq.png"]
prompt = "Image 1 is Big Stan, a finished paper standee pizza slice mascot. Redraw Big Stan, the Chicago deep dish pizza slice, as a thick deep pan pizza: a plump, chunky, deep body with tall thick walls of golden crust all around it, the top full of glossy red tomato sauce that overflows the rim and runs down the front and sides in long fat drips with a drop at the bottom, three round pepperoni, thick round arms with white gloves, heavy black boots. The silhouette must NOT be a sharp straight-edged triangle: draw it as a soft rounded blob-like wedge, like a squishy plush toy, with both long sides bulging outward in curves, every corner fully rounded, and the bottom tip rounded like a fingertip. The body tilts and bends sideways a little. Limbs are thick soft rounded tubes. It must still read instantly as a pizza slice. Keep exactly image 1's material, thick white paper cut border, clean flat colours with one soft shade, and above all its face: two small plain blank black dot eyes, no eyebrows, no white eyeballs, no pupils, a flat heavy downturned line mouth, grumpy and stubborn. Standing and facing slightly right, the whole figure visible head to feet. Image 2 shows only the paper material to borrow; do not copy its characters. The background is one perfectly flat, uniformly lit magenta fill: no spotlight, no gradient, no cast shadow, no floor shadow and no shadow shapes on the background. Absolutely no text, letters, numbers, logos, labels, signs or lettering anywhere in the image. Exactly two arms and two legs, no extra limbs or hands."

[shots.s_e]
refs = ["characters/slice-deep/references/paper-master.png", "paper/style_pm_sq.png"]
prompt = "Image 1 is Big Stan, a finished paper standee pizza slice mascot. Redraw Big Stan, the Chicago deep dish pizza slice: a heavy, thick, bulging slab-like body like a slice cut from a deep pan pie, slumping a little, crust walls puffed up like a pillow, sauce piled on top and dripping down him in long drips with a fat drop at the bottom, three round pepperoni, thick soft arms with white gloves, heavy black boots. The slice is made of soft bendable dough: the body curves in a gentle banana bend, the long sides are wavy and bulging, the crust end sags and the lower tip droops over to one side, all corners are rounded off, nothing is straight or rigid. Arms and legs are soft curvy noodles. It must still read instantly as a pizza slice. Keep exactly image 1's material, thick white paper cut border, clean flat colours with one soft shade, and above all its face: two small plain blank black dot eyes, no eyebrows, no white eyeballs, no pupils, a flat heavy downturned line mouth, grumpy and stubborn. Standing and facing slightly right, the whole figure visible head to feet. Image 2 shows only the paper material to borrow; do not copy its characters. The background is one perfectly flat, uniformly lit magenta fill: no spotlight, no gradient, no cast shadow, no floor shadow and no shadow shapes on the background. Absolutely no text, letters, numbers, logos, labels, signs or lettering anywhere in the image. Exactly two arms and two legs, no extra limbs or hands."
