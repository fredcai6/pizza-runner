models = ["qwen-edit"]
seeds = [1, 2, 3]
width = 1024
height = 1024
comfy_args = ["--reserve-vram", "1.5"]
template = "{action}"

[shots.s_a]
refs = ["characters/slice-deep/references/paper-master.png", "paper/style_pm_sq.png"]
prompt = "Image 1 is Big Stan, a finished paper standee pizza slice mascot. Redraw Big Stan, the deep dish pizza slice, softer. He stays saucy: a thick glossy red tomato sauce layer on top over the cheese, and long red sauce drips running down his sides with a fat drop at the bottom, three round pepperoni. He reads as thick, deep and pan-baked: a tall chunky body with a thick, puffy golden crust wall all around, rounded not sharp. Burly rounded arms with white gloves, heavy black boots. Soften the shapes: round every corner, give every edge a soft bulge and curve, bend the whole body gently, and use soft, rounder, curvier limbs. No rigid flat triangle, no straight stiff edges. Keep exactly image 1's material, thick white paper cut border, clean flat colours with one soft shade, and above all its face: two small plain blank black dot eyes, no eyebrows, no white eyeballs, no pupils, a flat heavy downturned line mouth, grumpy and stubborn. Standing and facing slightly right, the whole figure visible head to feet. Image 2 shows only the paper material to borrow; do not copy its characters. The background is one perfectly flat, uniformly lit magenta fill: no spotlight, no gradient, no cast shadow, no floor shadow and no shadow shapes on the background. Absolutely no text, letters, numbers, logos, labels, signs or lettering anywhere in the image. Exactly two arms and two legs, no extra limbs or hands."

[shots.s_b]
refs = ["characters/slice-deep/references/paper-master.png", "paper/style_pm_sq.png"]
prompt = "Image 1 is Big Stan, a finished paper standee pizza slice mascot. Redraw Big Stan, the deep dish pizza slice, as a plump, heavy, pan-baked wedge: a thick rounded golden crust wall bulging around him like a pie pan, soft rounded corners, the top brimming with glossy red tomato sauce that spills over the rim and runs down his sides in fat drips, three round pepperoni, thick rounded arms with white gloves, heavy black boots. Make the whole body soft and pillowy like a squishy cloth toy: very rounded corners, plump bulging edges, a gentle S-curve bend in the body, noodle-soft arms and legs, and a rounded tip instead of a sharp point. It must still read instantly as a pizza slice. Keep exactly image 1's material, thick white paper cut border, clean flat colours with one soft shade, and above all its face: two small plain blank black dot eyes, no eyebrows, no white eyeballs, no pupils, a flat heavy downturned line mouth, grumpy and stubborn. Standing and facing slightly right, the whole figure visible head to feet. Image 2 shows only the paper material to borrow; do not copy its characters. The background is one perfectly flat, uniformly lit magenta fill: no spotlight, no gradient, no cast shadow, no floor shadow and no shadow shapes on the background. Absolutely no text, letters, numbers, logos, labels, signs or lettering anywhere in the image. Exactly two arms and two legs, no extra limbs or hands."

[shots.s_c]
refs = ["characters/slice-deep/references/paper-master.png", "paper/style_pm_sq.png"]
prompt = "Image 1 is Big Stan, a finished paper standee pizza slice mascot. Redraw Big Stan, the Chicago deep dish pizza slice, soft and slumped: a deep, thick, bulging body that slouches a little, a puffy rounded crust wall, a lake of red sauce on top spilling over and dripping down him in long drips with a fat drop at the bottom, three round pepperoni, thick soft arms with white gloves, heavy black boots. Make the slice limp and drooping: it sags and bows under its own weight, the edges wave in soft curves, the corners are rounded, the tip hangs a little to one side, and the arms and legs are soft and rounded. It must still read instantly as a pizza slice, never a rigid flat triangle. Keep exactly image 1's material, thick white paper cut border, clean flat colours with one soft shade, and above all its face: two small plain blank black dot eyes, no eyebrows, no white eyeballs, no pupils, a flat heavy downturned line mouth, grumpy and stubborn. Standing and facing slightly right, the whole figure visible head to feet. Image 2 shows only the paper material to borrow; do not copy its characters. The background is one perfectly flat, uniformly lit magenta fill: no spotlight, no gradient, no cast shadow, no floor shadow and no shadow shapes on the background. Absolutely no text, letters, numbers, logos, labels, signs or lettering anywhere in the image. Exactly two arms and two legs, no extra limbs or hands."
