[shots.wallstreet_far]
input = "/mnt/data/sprite-forge/paper-ny/in/wallstreet-far-skyline-half.png"
prompt = "Image 1 is a hazy distant skyline whose lower part is smeared flat. Rebuild only the far background as pale layered cut paper in the material of image 2: a distant skyline of tall skyscraper towers and pale stone bank buildings with tall columns and pediments, in lavender, blue-grey and a touch of peach. Below the towers, plain pale flat buildings continue to the bottom edge. Flat shapes in only two or three very pale tones, no windows, no outlines, a faint paper grain. Remove everything near the camera: no trees with trunks, no billboards, no signs, no cars, no street lamps, no shop fronts, no roads, no small houses in front. A plain pale paper sky fills the top of the image. No text, letters, numbers, logos, signs or lettering anywhere; signs and flags are blank."
