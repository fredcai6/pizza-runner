run = "paper/hq-1"
seeds = [1, 2, 3]
refs = ["paper/style_pm_sq.png"]

[shots.back]
input = "/mnt/data/sprite-forge/paper-ny/in/hq-back-flat.png"
prompt = "Image 1 is the back room of a pizzeria: a brick wall with a hanging bulb, a pipe, a shelf of flour sacks and tins on the left, a big corkboard on the right wall and a concrete floor. Rebuild it as a paper diorama back room in the material of image 2: flat cut pieces of soft pastel card, a warm terracotta-pink brick wall as flat card with a few simple lighter brick lines, a pale grey-lilac floor card, a cream baseboard, one soft shade per colour, a faint paper grain, gently cut edges. Keep everything in the same places and the same size, above all the big corkboard on the right: a flat tan cork card in a cream card frame, empty. The bulb is a flat cream paper circle with a soft glow. No outlines heavier than a hairline, no white border. No text, letters, numbers, logos, labels or lettering anywhere."

[shots.mid]
input = "/mnt/data/sprite-forge/paper-ny/in/hq-mid-flat.png"
prompt = "Image 1 is a set of pizzeria props standing on the floor on flat magenta: a stack of pizza boxes, a bucket with a mop, a flour sack, a table with a box and a rolling pin, a mixer and a stool. Rebuild each as a flat paper cut-out in the material of image 2: flat pieces of soft pastel card with one soft shade, a faint paper grain, gently cut edges, no outlines, no white border, no shadow. Same places, same size. The background stays flat magenta. No text, letters, numbers, logos, labels or lettering anywhere."

[shots.front]
input = "/mnt/data/sprite-forge/paper-ny/in/hq-front-flat.png"
prompt = "Image 1 is dark foreground framing on flat magenta: a tall shelf at the left edge, a stack of boxes at the bottom right, a ceiling pipe along the top with brackets and a dangling cable with a bulb. Rebuild each as a flat paper cut-out in the material of image 2: a mid-brown card shelf with flat card boxes on it, flat kraft-card boxes, a dusty-blue card pipe, soft muted colours, one soft shade each, a faint paper grain, no black, no white border, no shadow. Same places, same size. The background stays flat magenta. No text, letters, numbers, logos, labels or lettering anywhere."

[shots.table]
input = "/mnt/data/sprite-forge/paper-ny/in/hq-table-flat.png"
prompt = "Image 1 is a long wooden prep table on flat magenta. Rebuild it as a flat paper cut-out in the material of image 2: flat pieces of warm tan and brown card with one soft shade, a faint paper grain, gently cut edges, no outlines, no white border, no shadow. Same place, same size. The background stays flat magenta. No text, letters, numbers, logos, labels or lettering anywhere."
