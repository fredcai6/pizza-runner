[shots.flour]
input = "/mnt/data/sprite-forge/paper-obstacles/in/flour.png"
prompt = "Image 1 is three rough pale shapes on flat magenta. Rebuild them as three big fat cloth flour sacks for a pizzeria, two side by side with one on top, plump and a little slumped, tied at the top with string, off-white cloth with a pale blue stripe and a printed picture of a wheat ear, a dusting of white flour on them, flat paper cut-out art in the material of image 2, seen from the front at eye level, standing on the ground at the bottom of the image, in the same place and at the same size as the shape in image 1. Flat pieces of card with one soft shade each, a faint paper grain, gently cut edges, no pen outlines, no white border, no cast shadow. The top is flat and wide enough to stand on. The background stays perfectly flat magenta. No text, letters, numbers, logos or lettering anywhere: every label is a picture only."

