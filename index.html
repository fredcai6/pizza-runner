<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Pizza Runner</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="stage" width="1280" height="720"></canvas>
  <div id="controls" class="hidden">
    <button id="pauseBtn" class="corner" aria-label="Pause (Esc or P)"><i></i><i></i><span>PAUSE</span></button>
    <div class="pad move">
      <button id="turnBtn" data-key="turn" class="turn dim">TURN</button>
      <button data-key="left">◀</button>
      <button data-key="right">▶</button>
    </div>
    <div class="pad">
      <button id="specialBtn" data-key="special" class="act special">SPECIAL</button>
      <button data-key="power" class="act topping">TOPPING</button>
      <button data-key="jump" class="jump">JUMP</button>
    </div>
  </div>
  <div id="dialog" class="hidden"><div class="who"></div><div class="line"></div></div>
  <div id="screen"></div>
  <div id="pause" class="hidden"><div class="sheet"><h2>Paused</h2><div class="actions">
    <button id="resumeBtn">Resume</button><button id="pauseMapBtn" class="quiet">Map</button><button id="pauseBoardBtn" class="quiet">Corkboard</button><button id="fullBtn" class="quiet">Full screen</button><button id="pausePlaytestBtn" class="quiet">Playtest</button><button id="muteBtn" class="quiet">Sound: on</button>
  </div></div></div>
  <div id="overlay" class="hidden"></div>
  <div id="turn">Turn your phone sideways</div>
  <script src="js/maps.js"></script>
  <script src="js/content.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/play.js"></script>
  <script src="js/hq.js"></script>
  <script src="js/board.js"></script>
  <script src="js/map.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
