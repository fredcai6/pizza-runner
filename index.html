<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Pizza Runner</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="stage" width="800" height="400"></canvas>
  <div id="controls" class="hidden">
    <div class="pad">
      <button data-key="left">◀</button>
      <button data-key="right">▶</button>
    </div>
    <div class="pad">
      <button id="giveBtn" data-key="give" class="ctx off"></button>
      <button id="specialBtn" data-key="special" class="act">DASH</button>
      <button data-key="power" class="act">POWER</button>
      <button data-key="jump" class="jump">JUMP</button>
    </div>
  </div>
  <div id="screen"></div>
  <script src="js/content.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/play.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
